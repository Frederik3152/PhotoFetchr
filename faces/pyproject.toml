[project]
name = "photofetchr-faces"
version = "0.1.0"
description = "Face detection, face embeddings and people suggestions for PhotoFetchr, stored in pgvector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "insightface>=0.7.3",
    "onnxruntime>=1.20",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "requests>=2.32",
    "flask>=3.1",
    "gunicorn>=23",
]
